{% load static %}
<!DOCTYPE html>
<html>
<head>
    <link rel="stylesheet" href="{% static 'css/styles.css' %}">
    <title>{% if post %}Edit{% else %}Create{% endif %} Post</title>
</head>
<body>
<h1>{% if post %}Edit{% else %}Create{% endif %} Post</h1>
<form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit">{% if post %}Update{% else %}Create{% endif %}</button>
</form>
<a href="{% url 'post_list' %}">Back to List</a>
</body>
</html>
